# Copier en inventory.yml et adapter.
all:
  vars:
    ceph_admin_host: ceph1           # hôte qui possède client.admin (delegate_to)
  children:
    ceph_admin:
      hosts:
        ceph1: {ansible_host: ceph1.example.lan, ansible_user: root}
    cephfs_clients:
      vars: {ansible_user: root}
      hosts:
        app1: {ansible_host: app1.example.lan}
        app2: {ansible_host: app2.example.lan}
