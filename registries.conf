# /etc/containers/registries.conf.d/99-airgap.conf
# Redirige tous les registres publics vers le registre local du réseau air-gap.
# Remplacer registry.local:5000 par l'adresse de votre registre (ou Artifactory/Harbor/Nexus).
# Les images y sont rangées sous <registre-local>/<registre-d'origine>/<chemin> (ce que fait mirror.sh).

unqualified-search-registries = ["quay.io", "docker.io"]
short-name-mode = "permissive"

[[registry]]
prefix = "quay.io"
location = "registry.local:5000/quay.io"
insecure = true          # registre HTTP ; mettre false si TLS

# cephadm 21.x publié garde DEFAULT_IMAGE = quay.ceph.io/ceph-ci/ceph:main :
# redirigé aussi au cas où `--image` serait oublié au bootstrap.
[[registry]]
prefix = "quay.ceph.io"
location = "registry.local:5000/quay.ceph.io"
insecure = true

[[registry]]
prefix = "docker.io"
location = "registry.local:5000/docker.io"
insecure = true

[[registry]]
prefix = "registry-1.docker.io"
location = "registry.local:5000/docker.io"
insecure = true

[[registry]]
prefix = "ghcr.io"
location = "registry.local:5000/ghcr.io"
insecure = true
